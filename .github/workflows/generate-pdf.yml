name: Generate PDF Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/*.md'
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install WeasyPrint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev python3-pip libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev libffi-dev shared-mime-info

      - name: Install WeasyPrint
        run: pip install weasyprint

      - name: Generate PDFs
        run: |
          for file in docs/*.md; do
            filename=$(basename "$file" .md)
            echo "Generating $filename.pdf from $file"
            weasyprint "$file" "docs/$filename.pdf"
          done

      - name: Commit generated PDFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-generate PDF versions"
          file_pattern: docs/*.pdf
          branch: main
